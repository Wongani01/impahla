<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3c2636" />
    <title>Impahla app · Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #382536; background: #f8f6f1; font: 16px/1.55 Arial, sans-serif; }
      main { width: min(100%, 440px); padding: 42px; border: 1px solid #eee8de; border-radius: 24px; background: #fffdf9; text-align: center; box-shadow: 0 18px 60px #38253612; }
      img { width: 56px; height: 56px; margin-bottom: 18px; }
      h1 { margin: 0 0 12px; font: 500 30px/1.15 Georgia, serif; }
      p { margin: 0; color: #756975; }
      a { display: inline-block; margin-top: 24px; padding: 12px 18px; border-radius: 999px; color: #fff; background: #4a3046; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/registry-mark.svg" alt="" />
      <h1>You&apos;re offline</h1>
      <p>Your saved contributions are still on this device. Reopen Impahla app when your connection returns to continue browsing.</p>
      <a href="/">Return to registry</a>
    </main>
  </body>
</html>
